# Copy this file to "config.properties" (next to the .jar or in the project root) and fill in your values.
# Never commit your config.properties, it contains your bot token.

# Required: the token of your discord bot
access_token=YOUR_BOT_TOKEN

# Upload changed slash/context commands on launch (default: false)
#commands.auto-upload=true

# Max. threads of the dispatcher, used by the DispatchEventHandler (default: available processors * 2)
#dispatcher_thread_max=8

# VM monitoring, only used when you call VMServer.get().enable()
#vm.port=9090
#vm.read-interval=5
# Bind address, the stream has no authentication (default: 127.0.0.1, use 0.0.0.0 for remote access)
#vm.host=127.0.0.1
